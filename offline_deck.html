<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=600, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Macro Deck 7 Inch (Offline Standalone)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background-color: #0b0d14;
      color: #e2e8f0;
      width: 1024px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col h-[600px] w-[1024px] relative bg-[#0b0d14] text-slate-100">

  <!-- HEADER (46px) -->
  <header class="h-[46px] bg-[#12151f] border-b border-[#1f2438] px-4 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-[15px] font-extrabold text-white tracking-wide">Macro Deck</span>
      <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Standalone Web Mode</span>
      </div>
    </div>

    <!-- Jadwal Sholat -->
    <div class="flex items-center bg-[#171b26] border border-[#242c40] px-3 py-1 rounded-md text-[11px] font-medium text-slate-300 gap-2 shadow-inner">
      <span class="text-amber-400 font-bold uppercase tracking-wider text-[10px]" id="prayer-city-label">
        JADWAL SHOLAT (Jakarta):
      </span>
      <span>Subuh <strong class="text-sky-300" id="pr-subuh">04:15</strong></span>
      <span class="text-slate-600">|</span>
      <span>Dzuhur <strong class="text-sky-300" id="pr-dzuhur">11:45</strong></span>
      <span class="text-slate-600">|</span>
      <span>Ashar <strong class="text-sky-300" id="pr-ashar">14:55</strong></span>
      <span class="text-slate-600">|</span>
      <span>Maghrib <strong class="text-sky-300" id="pr-maghrib">17:58</strong></span>
      <span class="text-slate-600">|</span>
      <span>Isya <strong class="text-sky-300" id="pr-isya">19:10</strong></span>
    </div>

    <!-- Jam & Fullscreen -->
    <div class="flex items-center gap-3">
      <span id="clock" class="font-mono font-bold text-sky-400 text-sm">00:00:00</span>
      <button onclick="toggleFullscreen()" title="Fullscreen F11" class="w-7 h-7 flex items-center justify-center hover:bg-slate-800 rounded text-slate-400 hover:text-white transition-colors text-xs border border-slate-700/60">
        ⛶
      </button>
    </div>
  </header>

  <!-- BODY -->
  <main class="flex-1 p-2 flex gap-2 overflow-hidden">
    <!-- SIDEBAR (76px) -->
    <nav id="sidebar" class="w-[76px] bg-[#12151f] border border-[#1f2438] rounded-xl flex flex-col p-1.5 gap-2 shrink-0 overflow-y-auto">
      <button onclick="switchCategory('default')" id="tab-default" class="flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold bg-[#1e293b] text-sky-400 border-l-4 border-sky-400 shadow-md">
        <span class="text-lg mb-0.5">🏠</span>
        <span>Default</span>
      </button>
      <button onclick="switchCategory('streaming')" id="tab-streaming" class="flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:bg-[#1a1f2e] hover:text-slate-200">
        <span class="text-lg mb-0.5">📡</span>
        <span>Stream</span>
      </button>
      <button onclick="switchCategory('editing')" id="tab-editing" class="flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:bg-[#1a1f2e] hover:text-slate-200">
        <span class="text-lg mb-0.5">✂️</span>
        <span>Editing</span>
      </button>
      <button onclick="switchCategory('gaming')" id="tab-gaming" class="flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:bg-[#1a1f2e] hover:text-slate-200">
        <span class="text-lg mb-0.5">🎮</span>
        <span>Gaming</span>
      </button>
    </nav>

    <!-- 3x3 GRID -->
    <section id="grid-container" class="flex-1 grid grid-cols-3 grid-rows-3 gap-2">
      <!-- Injected by JavaScript -->
    </section>

    <!-- YOUTUBE PANEL -->
    <aside class="w-[310px] bg-[#12151f] border border-[#1f2438] rounded-xl flex flex-col p-2 gap-2 shrink-0">
      <button onclick="reloadYouTube()" class="w-full py-2 bg-gradient-to-r from-slate-800 to-slate-700 hover:from-slate-700 hover:to-slate-600 border border-slate-600 rounded-lg text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all">
        <span>▶ PLAY YOUTUBE LIVE</span>
      </button>

      <div class="flex-1 bg-black rounded-lg border border-[#242c40] overflow-hidden relative flex flex-col items-center justify-center">
        <iframe
          id="yt-iframe"
          src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1"
          title="YouTube Live Stream"
          class="w-full h-full border-0 pointer-events-auto"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
        <div class="absolute top-2 left-2 pointer-events-none bg-red-600/90 text-white font-bold text-[9px] px-1.5 py-0.5 rounded tracking-wide uppercase flex items-center gap-1 shadow">
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
          LIVE
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="reloadYouTube()" class="flex-1 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-700 rounded-lg text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>▶ Play YouTube</span>
        </button>

        <button onclick="openChatPopout()" class="flex-1 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-700 rounded-lg text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>💬 Chat Pop-out</span>
        </button>
      </div>
    </aside>
  </main>

  <!-- TOAST -->
  <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-sky-950/90 border border-sky-500/80 text-sky-200 px-4 py-1.5 rounded-full text-xs font-semibold shadow-2xl backdrop-blur hidden flex items-center gap-2 z-50">
    <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
    <span id="toast-text">Pesan aksi</span>
  </div>

  <script>
    // State lokal (Tanpa server backend, murni browser)
    let currentCategory = 'default';
    let micMuted = true;
    let cameraOn = true;
    let isLive = false;
    let isRecording = false;
    let volumeLevel = 70;
    let cpuPercent = 35;
    let cpuTemp = 60;
    let toastTimeout = null;

    const DECK_PAGES = {
      default: [
        { id: 'b1', label: 'Mute Mic', sublabel: 'Status: OFF', icon: '🎙️', type: 'internal', action: 'mute_mic', color: 'red' },
        { id: 'b2', label: 'Camera Toggle', sublabel: 'Active Feed', icon: '📹', type: 'internal', action: 'camera_toggle', color: 'green' },
        { id: 'b3', label: 'CPU Temp', sublabel: 'Usage: --%', icon: '⚡', type: 'internal', action: 'cpu_stat', color: 'orange' },
        { id: 'b4', label: 'OBS Studio', sublabel: 'obsproject.com', icon: '🎦', type: 'hyperlink', action: 'https://obsproject.com', color: 'default' },
        { id: 'b5', label: 'Spotify', sublabel: 'open.spotify.com', icon: '🎵', type: 'hyperlink', action: 'https://open.spotify.com', color: 'green' },
        { id: 'b6', label: 'Discord', sublabel: 'discord.com/app', icon: '💬', type: 'hyperlink', action: 'https://discord.com/app', color: 'default' },
        { id: 'b7', label: 'Go Live', sublabel: 'Start Stream', icon: '🔴', type: 'internal', action: 'golive_toggle', color: 'red' },
        { id: 'b8', label: 'Start Recording', sublabel: 'Capture Display', icon: '⏺️', type: 'internal', action: 'record_toggle', color: 'default' },
        { id: 'b9', label: 'Volume Controls', sublabel: '+ / -', icon: '🔊', type: 'internal', action: 'volume_split', color: 'default' }
      ],
      streaming: [
        { id: 's1', label: 'Scene Cam', sublabel: 'Webcam Full', icon: '📹', type: 'toast', action: 'Scene Cam Aktif', color: 'default' },
        { id: 's2', label: 'Scene Screen', sublabel: 'Display Capture', icon: '🖥️', type: 'toast', action: 'Scene Display Aktif', color: 'default' },
        { id: 's3', label: 'Scene BRB', sublabel: 'Be Right Back', icon: '☕', type: 'toast', action: 'Scene BRB Ditampilkan', color: 'default' },
        { id: 's4', label: 'Mute Audio', sublabel: 'Mixer Master', icon: '🔇', type: 'toast', action: 'Audio Dimatikan', color: 'red' },
        { id: 's5', label: 'Twitch Dashboard', sublabel: 'Stream Manager', icon: '🌐', type: 'hyperlink', action: 'https://dashboard.twitch.tv', color: 'purple' },
        { id: 's6', label: 'YouTube Studio', sublabel: 'Live Control Room', icon: '🎬', type: 'hyperlink', action: 'https://studio.youtube.com', color: 'red' },
        { id: 's7', label: 'Cheering SFX', sublabel: 'Soundboard 1', icon: '🎉', type: 'sfx', action: 880, color: 'purple' },
        { id: 's8', label: 'Airhorn SFX', sublabel: 'Soundboard 2', icon: '💥', type: 'sfx', action: 440, color: 'orange' },
        { id: 's9', label: 'Save Buffer', sublabel: 'Replay Last 30s', icon: '⚡', type: 'toast', action: 'Replay Buffer Disimpan', color: 'blue' }
      ],
      editing: [
        { id: 'e1', label: 'Razor Tool (C)', sublabel: 'Split Clip', icon: '✂️', type: 'toast', action: 'Hotkey Razor Tool', color: 'default' },
        { id: 'e2', label: 'Ripple Delete', sublabel: 'Shift + Del', icon: '⏪', type: 'toast', action: 'Ripple Delete Terpicu', color: 'red' },
        { id: 'e3', label: 'Add Marker', sublabel: 'Marker (M)', icon: '📌', type: 'toast', action: 'Marker Ditambahkan', color: 'default' },
        { id: 'e4', label: 'Render In/Out', sublabel: 'Enter Key', icon: '⚡', type: 'toast', action: 'Rendering Dimulai', color: 'orange' },
        { id: 'e5', label: 'Quick Save', sublabel: 'Ctrl + S', icon: '💾', type: 'toast', action: 'Project Disimpan!', color: 'green' },
        { id: 'e6', label: 'Audio Normalize', sublabel: '-3dB Target', icon: '🔊', type: 'toast', action: 'Audio Dinormalisasi', color: 'blue' },
        { id: 'e7', label: 'Epidemic Sound', sublabel: 'Music Assets', icon: '🎵', type: 'hyperlink', action: 'https://www.epidemicsound.com', color: 'purple' },
        { id: 'e8', label: 'Canva Assets', sublabel: 'Thumbnails', icon: '🎨', type: 'hyperlink', action: 'https://canva.com', color: 'blue' },
        { id: 'e9', label: 'Export Video', sublabel: 'Ctrl + M', icon: '📤', type: 'toast', action: 'Export Dialog Terbuka', color: 'default' }
      ],
      gaming: [
        { id: 'g1', label: 'Discord Web', sublabel: 'Voice Channels', icon: '💬', type: 'hyperlink', action: 'https://discord.com/app', color: 'blue' },
        { id: 'g2', label: 'Steam Community', sublabel: 'Store & Friends', icon: '🚀', type: 'hyperlink', action: 'https://steamcommunity.com', color: 'default' },
        { id: 'g3', label: 'Speedrun Timer', sublabel: 'Start / Split', icon: '⏱️', type: 'toast', action: 'Timer Berjalan', color: 'purple' },
        { id: 'g4', label: 'Google Search', sublabel: 'Game Guide & Wiki', icon: '🌐', type: 'hyperlink', action: 'https://google.com', color: 'default' },
        { id: 'g5', label: 'FPS Boost Mode', sublabel: 'Clean Memory', icon: '⚡', type: 'toast', action: 'Game Mode Optimal', color: 'green' },
        { id: 'g6', label: 'Screenshot', sublabel: 'Capture Display', icon: '📸', type: 'toast', action: 'Screenshot Tersimpan', color: 'orange' },
        { id: 'g7', label: 'EQ Bass Profile', sublabel: 'Footsteps Boost', icon: '🎧', type: 'toast', action: 'EQ Profile: FPS Mode', color: 'blue' },
        { id: 'g8', label: 'Mute Game Vol', sublabel: 'Master Media', icon: '🔇', type: 'toast', action: 'Audio Di-mute', color: 'red' },
        { id: 'g9', label: 'Reddit Gaming', sublabel: 'Discussions', icon: '🎮', type: 'hyperlink', action: 'https://reddit.com/r/gaming', color: 'default' }
      ]
    };

    const COLOR_CLASSES = {
      default: 'bg-[#151926] border-[#242c42] text-slate-100 hover:border-sky-400',
      red: 'bg-red-500/15 border-red-500/80 text-red-200 shadow-[0_0_15px_rgba(239,68,68,0.2)]',
      green: 'bg-emerald-500/15 border-emerald-500/80 text-emerald-200 shadow-[0_0_15px_rgba(34,197,94,0.2)]',
      orange: 'bg-amber-500/15 border-amber-500/80 text-amber-200 shadow-[0_0_15px_rgba(245,158,11,0.2)]',
      blue: 'bg-sky-500/15 border-sky-500/80 text-sky-200 shadow-[0_0_15px_rgba(56,189,248,0.2)]',
      purple: 'bg-purple-500/15 border-purple-500/80 text-purple-200 shadow-[0_0_15px_rgba(168,85,247,0.2)]'
    };

    function playAudioBeep(freq = 500) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      t.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { t.classList.add('hidden'); }, 3000);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function switchCategory(cat) {
      playAudioBeep(520);
      currentCategory = cat;
      ['default', 'streaming', 'editing', 'gaming'].forEach(c => {
        const btn = document.getElementById(`tab-${c}`);
        if (c === cat) {
          btn.className = "flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold bg-[#1e293b] text-sky-400 border-l-4 border-sky-400 shadow-md";
        } else {
          btn.className = "flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold text-slate-400 hover:bg-[#1a1f2e] hover:text-slate-200";
        }
      });
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      const list = DECK_PAGES[currentCategory] || [];

      list.forEach((btn, idx) => {
        if (btn.action === 'volume_split') {
          const split = document.createElement('div');
          split.className = 'flex gap-2';
          split.innerHTML = `
            <button onclick="adjustVolume(5)" class="flex-1 flex flex-col items-center justify-center rounded-xl border bg-[#151926] border-[#242c42] hover:border-sky-400 active:scale-95 text-slate-200 transition-all">
              <span class="text-base text-sky-400">🔊</span>
              <span class="font-bold text-xs mt-0.5">+</span>
              <span class="text-[10px] text-slate-400">Vol ${volumeLevel}%</span>
            </button>
            <button onclick="adjustVolume(-5)" class="flex-1 flex flex-col items-center justify-center rounded-xl border bg-[#151926] border-[#242c42] hover:border-sky-400 active:scale-95 text-slate-200 transition-all">
              <span class="text-base text-slate-400">🔉</span>
              <span class="font-bold text-xs mt-0.5">-</span>
              <span class="text-[10px] text-slate-400">Volume</span>
            </button>
          `;
          container.appendChild(split);
          return;
        }

        const colorClass = COLOR_CLASSES[btn.color] || COLOR_CLASSES.default;
        const b = document.createElement('button');
        b.className = `flex flex-col items-center justify-center rounded-xl p-3 border transition-all active:scale-[0.98] relative ${colorClass}`;

        let displayLabel = btn.label;
        let displaySub = btn.sublabel;

        if (btn.action === 'mute_mic') {
          displayLabel = micMuted ? 'Mute Mic' : 'Mic Active';
          displaySub = micMuted ? 'Status: OFF' : 'Status: ON';
        } else if (btn.action === 'camera_toggle') {
          displayLabel = cameraOn ? 'Camera Toggle' : 'Camera OFF';
          displaySub = cameraOn ? 'Active Feed' : 'Disabled';
        } else if (btn.action === 'golive_toggle') {
          displayLabel = isLive ? 'LIVE ACTIVE' : 'Go Live';
          displaySub = isLive ? '00:04:12' : 'Start Stream';
        } else if (btn.action === 'record_toggle') {
          displayLabel = isRecording ? 'Recording...' : 'Start Record';
          displaySub = isRecording ? 'Writing MP4' : 'Capture Display';
        } else if (btn.action === 'cpu_stat') {
          displaySub = `Usage: ${cpuPercent}%`;
        }

        b.innerHTML = `
          ${btn.action === 'cpu_stat' ? `<span class="absolute top-2 right-2 text-[10px] font-bold text-amber-400 bg-amber-950/60 px-1 py-0.5 rounded border border-amber-500/30">${cpuTemp}°C</span>` : ''}
          <span class="text-2xl mb-1">${btn.icon}</span>
          <span class="font-bold text-xs tracking-wide text-center truncate max-w-full px-1">${displayLabel}</span>
          <span class="text-[10px] opacity-70 mt-0.5 text-center truncate max-w-full px-1">${displaySub}</span>
        `;

        b.onclick = () => {
          playAudioBeep(480 + idx * 20);
          handleClick(btn);
        };

        container.appendChild(b);
      });
    }

    function handleClick(btn) {
      if (btn.action === 'mute_mic') {
        micMuted = !micMuted;
        showToast(micMuted ? "Microphone MUTED" : "Microphone ACTIVE");
        renderGrid();
      } else if (btn.action === 'camera_toggle') {
        cameraOn = !cameraOn;
        showToast(cameraOn ? "Camera ON" : "Camera OFF");
        renderGrid();
      } else if (btn.action === 'golive_toggle') {
        isLive = !isLive;
        showToast(isLive ? "BROADCAST STARTED!" : "Stream Ended");
        renderGrid();
      } else if (btn.action === 'record_toggle') {
        isRecording = !isRecording;
        showToast(isRecording ? "Recording in progress..." : "Recording Saved");
        renderGrid();
      } else if (btn.action === 'cpu_stat') {
        showToast(`CPU Usage: ${cpuPercent}% | Temp: ${cpuTemp}°C`);
      } else if (btn.type === 'hyperlink') {
        window.open(btn.action, '_blank');
        showToast(`Membuka: ${btn.label}`);
      } else if (btn.type === 'sfx') {
        playAudioBeep(btn.action);
        showToast(`Sound FX Diputar: ${btn.label}`);
      } else {
        showToast(btn.action || btn.label);
      }
    }

    function adjustVolume(step) {
      playAudioBeep(step > 0 ? 580 : 380);
      volumeLevel = Math.min(100, Math.max(0, volumeLevel + step));
      showToast(`Volume: ${volumeLevel}%`);
      renderGrid();
    }

    function reloadYouTube() {
      playAudioBeep(600);
      document.getElementById('yt-iframe').src = "https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1";
      showToast('YouTube stream dimuat ulang');
    }

    function openChatPopout() {
      playAudioBeep(560);
      window.open("https://www.youtube.com/live_chat?is_popout=1", "_blank", "width=400,height=600");
    }

    // Ambil Jadwal Sholat Aladhan API langsung di browser
    async function fetchPrayerTimes() {
      try {
        const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=11');
        if (res.ok) {
          const json = await res.json();
          const t = json.data.timings;
          document.getElementById('pr-subuh').innerText = t.Fajr;
          document.getElementById('pr-dzuhur').innerText = t.Dhuhr;
          document.getElementById('pr-ashar').innerText = t.Asr;
          document.getElementById('pr-maghrib').innerText = t.Maghrib;
          document.getElementById('pr-isya').innerText = t.Isha;
        }
      } catch (e) {
        console.warn('Menggunakan fallback jadwal sholat');
      }
    }

    // Timer Jam & Fluktuasi CPU
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);

    setInterval(() => {
      cpuPercent = Math.min(92, Math.max(15, Math.round(cpuPercent + (Math.random() * 8 - 4))));
      cpuTemp = Math.min(80, Math.max(48, Math.round(cpuTemp + (Math.random() * 2 - 1))));
      if (currentCategory === 'default') renderGrid();
    }, 2500);

    // Inisialisasi
    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      fetchPrayerTimes();
    });
  </script>
</body>
</html>
