<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=600, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Macro Deck 7 Inch</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #0b0d14;
      color: #e2e8f0;
      width: 1024px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col h-[600px] w-[1024px] relative bg-[#0b0d14] text-slate-100">

  <!-- 1. HEADER (46px) -->
  <header class="h-[46px] bg-[#12151f] border-b border-[#1f2438] px-4 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-[15px] font-extrabold text-white tracking-wide">Macro Deck</span>
      <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="conn-status">Web Local Connected</span>
      </div>
    </div>

    <!-- Jadwal Sholat -->
    <div class="flex items-center bg-[#171b26] border border-[#242c40] px-3 py-1 rounded-md text-[11px] font-medium text-slate-300 gap-2 shadow-inner">
      <span class="text-amber-400 font-bold uppercase tracking-wider text-[10px]" id="prayer-city-label">
        JADWAL SHOLAT (Jakarta):
      </span>
      <span>Subuh <strong class="text-sky-300" id="pr-subuh">04:15</strong></span>
      <span class="text-slate-600">|</span>
      <span>Dzuhur <strong class="text-sky-300" id="pr-dzuhur">11:45</strong></span>
      <span class="text-slate-600">|</span>
      <span>Ashar <strong class="text-sky-300" id="pr-ashar">14:55</strong></span>
      <span class="text-slate-600">|</span>
      <span>Maghrib <strong class="text-sky-300" id="pr-maghrib">17:58</strong></span>
      <span class="text-slate-600">|</span>
      <span>Isya <strong class="text-sky-300" id="pr-isya">19:10</strong></span>
    </div>

    <!-- Jam & Mode Kiosk Fullscreen -->
    <div class="flex items-center gap-3">
      <span id="clock" class="font-mono font-bold text-sky-400 text-sm">00:00:00</span>
      <button onclick="toggleFullscreen()" title="Fullscreen F11" class="w-7 h-7 flex items-center justify-center hover:bg-slate-800 rounded text-slate-400 hover:text-white transition-colors text-xs border border-slate-700/60">
        ⛶
      </button>
    </div>
  </header>

  <!-- 2. BODY (Sidebar + Central 3x3 Grid + YouTube Panel) -->
  <main class="flex-1 p-2 flex gap-2 overflow-hidden">
    
    <!-- SIDEBAR KATEGORI (76px) -->
    <nav id="sidebar" class="w-[76px] bg-[#12151f] border border-[#1f2438] rounded-xl flex flex-col p-1.5 gap-2 shrink-0 overflow-y-auto">
      <!-- Dynamic Sidebar Categories injected via JS -->
    </nav>

    <!-- CENTRAL 3x3 GRID (Expanded) -->
    <section id="grid-container" class="flex-1 grid grid-cols-3 grid-rows-3 gap-2">
      <!-- Dynamic Buttons injected via JS -->
    </section>

    <!-- RIGHT PANEL: YOUTUBE LIVE -->
    <aside class="w-[310px] bg-[#12151f] border border-[#1f2438] rounded-xl flex flex-col p-2 gap-2 shrink-0">
      <button onclick="reloadYouTube()" class="w-full py-2 bg-gradient-to-r from-slate-800 to-slate-700 hover:from-slate-700 hover:to-slate-600 border border-slate-600 rounded-lg text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all">
        <span>▶ PLAY YOUTUBE LIVE</span>
      </button>

      <div class="flex-1 bg-black rounded-lg border border-[#242c40] overflow-hidden relative flex flex-col items-center justify-center">
        <iframe
          id="yt-iframe"
          src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1"
          title="YouTube Live Stream"
          class="w-full h-full border-0 pointer-events-auto"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
        <div class="absolute top-2 left-2 pointer-events-none bg-red-600/90 text-white font-bold text-[9px] px-1.5 py-0.5 rounded tracking-wide uppercase flex items-center gap-1 shadow">
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
          LIVE
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="reloadYouTube()" class="flex-1 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-700 rounded-lg text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>▶ Play YouTube</span>
        </button>

        <button onclick="openChatPopout()" class="flex-1 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-700 rounded-lg text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>💬 Chat Pop-out</span>
        </button>
      </div>
    </aside>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-sky-950/90 border border-sky-500/80 text-sky-200 px-4 py-1.5 rounded-full text-xs font-semibold shadow-2xl backdrop-blur hidden flex items-center gap-2 z-50">
    <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
    <span id="toast-text">Pesan aksi</span>
  </div>

  <script>
    // State Aplikasi
    let currentConfig = {};
    let activeCategory = 'default';
    let localStats = { cpu_percent: 0, volume: 70, state: {} };
    let toastTimeout = null;

    const COLOR_CLASSES = {
      default: 'bg-[#151926] border-[#242c42] text-slate-100 hover:border-sky-400',
      red: 'bg-red-500/15 border-red-500/80 text-red-200 shadow-[0_0_15px_rgba(239,68,68,0.2)]',
      green: 'bg-emerald-500/15 border-emerald-500/80 text-emerald-200 shadow-[0_0_15px_rgba(34,197,94,0.2)]',
      orange: 'bg-amber-500/15 border-amber-500/80 text-amber-200 shadow-[0_0_15px_rgba(245,158,11,0.2)]',
      blue: 'bg-sky-500/15 border-sky-500/80 text-sky-200 shadow-[0_0_15px_rgba(56,189,248,0.2)]',
      purple: 'bg-purple-500/15 border-purple-500/80 text-purple-200 shadow-[0_0_15px_rgba(168,85,247,0.2)]'
    };

    function playAudioBeep(freq = 500) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      t.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        t.classList.add('hidden');
      }, 3000);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Load Configuration
    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          currentConfig = await res.json();
          renderSidebar();
          renderGrid();
          if (currentConfig.settings && currentConfig.settings.stream_url) {
            document.getElementById('yt-iframe').src = currentConfig.settings.stream_url;
          }
        }
      } catch (err) {
        console.warn('Using default config fallback:', err);
      }
    }

    // Fetch Stats (CPU, Vol, Time)
    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) {
          localStats = await res.json();
          document.getElementById('clock').innerText = localStats.time || new Date().toTimeString().split(' ')[0];
          updateDynamicButtons();
        }
      } catch (err) {
        document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
      }
    }

    // Fetch Prayer Times
    async function fetchPrayer() {
      try {
        const city = (currentConfig.settings && currentConfig.settings.city) || 'Jakarta';
        document.getElementById('prayer-city-label').innerText = `JADWAL SHOLAT (${city}):`;
        const res = await fetch(`/api/prayer?city=${encodeURIComponent(city)}`);
        if (res.ok) {
          const p = await res.json();
          document.getElementById('pr-subuh').innerText = p.Subuh || '04:15';
          document.getElementById('pr-dzuhur').innerText = p.Dzuhur || '11:45';
          document.getElementById('pr-ashar').innerText = p.Ashar || '14:55';
          document.getElementById('pr-maghrib').innerText = p.Maghrib || '17:58';
          document.getElementById('pr-isya').innerText = p.Isya || '19:10';
        }
      } catch (e) {}
    }

    // Render Sidebar
    function renderSidebar() {
      const sb = document.getElementById('sidebar');
      sb.innerHTML = '';
      const items = currentConfig.sidebar || [
        { id: 'default', label: 'Default', icon: '🏠' },
        { id: 'streaming', label: 'Stream', icon: '📡' },
        { id: 'editing', label: 'Editing', icon: '✂️' },
        { id: 'gaming', label: 'Gaming', icon: '🎮' }
      ];

      items.forEach(item => {
        const btn = document.createElement('button');
        const isActive = activeCategory === item.id;
        btn.className = `flex flex-col items-center justify-center py-2.5 rounded-lg text-[11px] font-semibold transition-all ${
          isActive ? 'bg-[#1e293b] text-sky-400 border-l-4 border-sky-400 shadow-md' : 'text-slate-400 hover:bg-[#1a1f2e] hover:text-slate-200'
        }`;
        btn.innerHTML = `<span class="text-lg mb-0.5">${item.icon}</span><span class="truncate w-full text-center px-1">${item.label}</span>`;
        btn.onclick = () => {
          playAudioBeep(520);
          activeCategory = item.id;
          renderSidebar();
          renderGrid();
        };
        sb.appendChild(btn);
      });
    }

    // Render Central 3x3 Grid
    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      const buttons = (currentConfig.pages && currentConfig.pages[activeCategory]) || [];

      buttons.slice(0, 9).forEach((btn, idx) => {
        if (btn.type === 'internal' && btn.action === 'volume_split') {
          const split = document.createElement('div');
          split.className = 'flex gap-2';
          split.innerHTML = `
            <button onclick="triggerAction({type:'internal', action:'volume_up', label:'Volume +'})" class="flex-1 flex flex-col items-center justify-center rounded-xl border bg-[#151926] border-[#242c42] hover:border-sky-400 active:scale-95 text-slate-200 transition-all">
              <span class="text-base text-sky-400">🔊</span>
              <span class="font-bold text-xs mt-0.5">+</span>
              <span class="text-[10px] text-slate-400">Volume</span>
            </button>
            <button onclick="triggerAction({type:'internal', action:'volume_down', label:'Volume -'})" class="flex-1 flex flex-col items-center justify-center rounded-xl border bg-[#151926] border-[#242c42] hover:border-sky-400 active:scale-95 text-slate-200 transition-all">
              <span class="text-base text-slate-400">🔉</span>
              <span class="font-bold text-xs mt-0.5">-</span>
              <span class="text-[10px] text-slate-400">Volume</span>
            </button>
          `;
          container.appendChild(split);
          return;
        }

        const colorClass = COLOR_CLASSES[btn.color] || COLOR_CLASSES.default;
        const b = document.createElement('button');
        b.id = `deck-btn-${idx}`;
        b.className = `flex flex-col items-center justify-center rounded-xl p-3 border transition-all active:scale-[0.98] ${colorClass}`;
        
        let label = btn.label;
        let sub = btn.sublabel || '';

        b.innerHTML = `
          <span class="text-2xl mb-1">${btn.icon}</span>
          <span class="font-bold text-xs tracking-wide text-center truncate max-w-full px-1">${label}</span>
          <span class="text-[10px] opacity-70 mt-0.5 text-center truncate max-w-full px-1">${sub}</span>
        `;

        b.onclick = () => {
          playAudioBeep(480 + idx * 20);
          triggerAction(btn);
        };

        container.appendChild(b);
      });
    }

    // Trigger Action via POST /api/action
    async function triggerAction(btn) {
      try {
        const res = await fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(btn)
        });
        if (res.ok) {
          const data = await res.json();
          showToast(data.message || `Aksi ${btn.label} terkirim`);
          fetchStats();
        }
      } catch (err) {
        showToast(`Eksekusi lokal: ${btn.label}`);
      }
    }

    function updateDynamicButtons() {
      // Update label tombol jika status berubah (mic, cam, dll)
    }

    function reloadYouTube() {
      playAudioBeep(600);
      const url = (currentConfig.settings && currentConfig.settings.stream_url) || 'https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1';
      document.getElementById('yt-iframe').src = url;
      showToast('YouTube stream dimuat ulang');
    }

    function openChatPopout() {
      playAudioBeep(560);
      const chatUrl = (currentConfig.settings && currentConfig.settings.chat_url) || 'https://www.youtube.com/live_chat?is_popout=1';
      window.open(chatUrl, '_blank', 'width=400,height=600');
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      fetchPrayer();
      fetchStats();
      setInterval(fetchStats, 2000);
      setInterval(fetchPrayer, 60000);
    });
  </script>
</body>
</html>
