name: Build Windows Portable EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pycaw comtypes keyboard

    - name: Build Standalone Windows EXE with Metadata
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "MacroDeck7Inch_Portable" `
          --version-file "version_info.txt" `
          --add-data "deck_config.json;." `
          --add-data "config.ini;." `
          --hidden-import "PyQt6.QtWebEngineWidgets" `
          --hidden-import "PyQt6.QtWebEngineCore" `
          --hidden-import "psutil" `
          --hidden-import "requests" `
          --hidden-import "keyboard" `
          main.py

    - name: Build Uncompressed Folder Version (Best for Corporate/Office Laptops)
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --name "MacroDeck7Inch_App" `
          --version-file "version_info.txt" `
          --add-data "deck_config.json;." `
          --add-data "config.ini;." `
          --hidden-import "PyQt6.QtWebEngineWidgets" `
          --hidden-import "PyQt6.QtWebEngineCore" `
          --hidden-import "psutil" `
          --hidden-import "requests" `
          --hidden-import "keyboard" `
          main.py
        Compress-Archive -Path "dist/MacroDeck7Inch_App/*" -DestinationPath "dist/MacroDeck7Inch_Corporate_Folder.zip"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacroDeck7Inch-Windows-Builds
        path: |
          dist/MacroDeck7Inch_Portable.exe
          dist/MacroDeck7Inch_Corporate_Folder.zip
          deck_config.json
          config.ini
          run_standalone.bat
